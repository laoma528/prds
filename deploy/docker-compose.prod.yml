# ============================================
# PRDS 生产部署 Compose - 使用 GHCR 预构建镜像
#
# 使用方式: 由 deploy/deploy.sh 调用，不要直接运行
# 手动运行: IMAGE=ghcr.io/laoma528/prds:latest docker compose -f deploy/docker-compose.prod.yml up -d
# ============================================

services:
  prds:
    image: ${IMAGE:-ghcr.io/laoma528/prds:latest}
    container_name: prds
    ports:
      - "8088:8000"
    env_file: ../.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../data/postgresql:/var/lib/postgresql
      - ../data/redis:/data
    networks:
      - pansou-network
      - astrbot-network
    restart: unless-stopped

networks:
  pansou-network:
    external: true
    name: pansou_pansou-network
  astrbot-network:
    external: true
    name: astrbot_astrbot_network
